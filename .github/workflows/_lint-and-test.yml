name: Lint and Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Verify ready-publish state
        run: |
          cargo publish --dry-run
          cargo package --list

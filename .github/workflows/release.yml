name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    name: Lint and Test
    uses: ./.github/workflows/_lint-and-test.yml

  build:
    name: Build
    needs: [checks]
    uses: ./.github/workflows/_build.yml

  draft-release:
    name: Prepare GitHub Draft Release
    runs-on: ubuntu-latest
    environment:
      name: release
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Acquire release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum *.whl *.tar.gz >SHA256SUMS
          sha512sum *.whl *.tar.gz >SHA512SUMS

      - name: Prepare GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh release create --draft --verify-tag
            '${{ github.ref_name }}' dist/**

  publish-cargo:
    name: Publish (Cargo)
    runs-on: ubuntu-latest
    needs: [draft-release]
    environment:
      name: release
      url: https://staging.crates.io/crates/test-work-rust/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
        with:
          url: https://staging.crates.io
      - name: Publish crate to crates.io
        run: cargo publish --locked --registry staging
        env:
          CARGO_REGISTRIES_STAGING_INDEX: sparse+https://index.staging.crates.io/
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    name: Publish (PyPI)
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/project/test-work-rust/
    needs: [draft-release]
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Acquire release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
